services:
  telegram-forwarder:
    build: .
    image: telegram-unified:latest
    container_name: telegram-forwarder
    # 如果需要使用 RSS 功能，请取消以下注释
    # ports:
    #   - 9804:8000
    restart: unless-stopped
    mem_limit: 650m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "grep -q main.py /proc/1/cmdline && test -f /app/sessions/user.session"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./db:/app/db
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./temp:/app/temp
      - ./ufb/config:/app/ufb/config
      - ./config:/app/config
      - ./migration:/app/migration
      - ./rss/data:/app/rss/data
      - ./rss/media:/app/rss/media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    stdin_open: true
    tty: true
